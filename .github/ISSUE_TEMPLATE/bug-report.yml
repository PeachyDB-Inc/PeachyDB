name: 🐛 Bug Report
description: File a structured report to help us fix an issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: clear-description
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: duplicate-check
    attributes:
      label: Have you checked existing issues?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have isolated this issue to this specific package.
          required: true
