name: 🐛 Bug Report
description: File a structured report to help us fix an issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: version
    attributes:
      label: Product Version
      description: Which Product Version are you using?
      multiple: false
      options:
        - 1.0.0
    validations:
      required: true
  - type: textarea
    id: clear-description
    attributes:
      label: What is the issue?
      description: Also tell us what you expected to happen.
      placeholder: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Duplicate check
      options:
        - label: I have checked existing issues for duplicates
          required: true
